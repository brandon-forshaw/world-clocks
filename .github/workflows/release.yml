# Signs the extension with Mozilla (unlisted) and publishes it, plus the update
# manifest Firefox checks, to GitHub Pages. Run it by pushing a tag like v1.6.1
# whose number matches "version" in extension/manifest.json (release.sh does both).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  pages: write      # publish to GitHub Pages
  id-token: write   # required by the Pages deploy action

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the tag matches the manifest version
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Point the extension at this repo's update manifest
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          BASE="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          jq --arg u "$BASE/updates.json" '.browser_specific_settings.gecko.update_url = $u' \
            extension/manifest.json > manifest.tmp && mv manifest.tmp extension/manifest.json
          echo "Update URL: $BASE/updates.json"

      - name: Pick out this version's release notes
        run: |
          awk -v v="## $VERSION" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No '## $VERSION' section in CHANGELOG.md"
            echo "Version $VERSION" > notes.md
          fi
          jq -n --rawfile notes notes.md '{version: {release_notes: {"en-GB": $notes, "en-US": $notes}}}' > amo-metadata.json
          cat notes.md

      - name: Validate with Mozilla's linter
        run: npx --yes web-ext@10 lint --source-dir extension --self-hosted --warnings-as-errors

      - name: Sign with Mozilla (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Add the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets first (see README)"
            exit 1
          fi
          mkdir -p dist
          set +e
          npx --yes web-ext@10 sign \
            --source-dir extension \
            --artifacts-dir dist \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --amo-metadata amo-metadata.json \
            --approval-timeout 1800000
          rc=$?
          set -e
          [ $rc -eq 0 ] && exit 0

          # Signing failed or timed out. If Mozilla already has this version (an earlier
          # attempt, or a dropped connection while waiting), download that signed copy.
          echo "::warning::web-ext sign failed (exit $rc), fetching $VERSION from Mozilla instead"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          jwt() {
            local now head body sig
            now=$(date +%s)
            head=$(printf '{"alg":"HS256","typ":"JWT"}' | b64)
            body=$(jq -nc --arg iss "$AMO_JWT_ISSUER" --arg jti "$(openssl rand -hex 16)" --argjson iat "$now" \
              '{iss: $iss, jti: $jti, iat: $iat, exp: ($iat + 240)}' | b64)
            sig=$(printf '%s.%s' "$head" "$body" | openssl dgst -sha256 -hmac "$AMO_JWT_SECRET" -binary | b64)
            printf '%s.%s.%s' "$head" "$body" "$sig"
          }
          GUID=$(jq -r .browser_specific_settings.gecko.id extension/manifest.json)
          URL=""
          for i in $(seq 1 20); do
            RESP=$(curl -fsS -H "Authorization: JWT $(jwt)" "https://addons.mozilla.org/api/v5/addons/$GUID/versions/$VERSION/" || true)
            URL=$(echo "$RESP" | jq -r 'if (.files[0].signed // true) then (.files[0].download_url // empty) else empty end' 2>/dev/null || true)
            [ -n "$URL" ] && break
            echo "Not signed yet (try $i of 20), waiting 30s"; sleep 30
          done
          if [ -z "$URL" ]; then echo "::error::Mozilla has no signed $VERSION to download"; exit 1; fi
          curl -fsSL -H "Authorization: JWT $(jwt)" -o "dist/world-clocks-$VERSION-signed.xpi" "$URL"
          unzip -l "dist/world-clocks-$VERSION-signed.xpi" | grep -q "META-INF/" || { echo "::error::Downloaded file isn't a signed xpi"; exit 1; }
          echo "Downloaded the signed $VERSION from Mozilla"

      - name: Build the update site
        run: |
          XPI=$(ls dist/*.xpi | head -n 1)
          if [ -z "$XPI" ]; then echo "::error::No signed .xpi was produced"; exit 1; fi
          mkdir -p site
          cp "$XPI" "site/world-clocks-$VERSION.xpi"
          cp "$XPI" site/world-clocks-latest.xpi
          HASH="sha256:$(sha256sum "$XPI" | cut -d' ' -f1)"
          ID=$(jq -r .browser_specific_settings.gecko.id extension/manifest.json)
          jq -n --arg id "$ID" --arg v "$VERSION" --arg link "$BASE/world-clocks-$VERSION.xpi" --arg hash "$HASH" \
            '{addons: {($id): {updates: [{version: $v, update_link: $link, update_hash: $hash}]}}}' > site/updates.json
          NOTES_HTML=$(sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' notes.md | sed -n 's/^- \(.*\)/<li>\1<\/li>/p')
          cat > site/index.html << HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>World Clocks</title>
          <style>body{font-family:system-ui,sans-serif;background:#12141a;color:#e8eaf0;max-width:600px;margin:60px auto;padding:0 16px;line-height:1.5}
          a{color:#3ddc84}code{background:#1c1f28;padding:2px 6px;border-radius:4px}li{margin:4px 0}h2{font-size:1rem;margin-top:28px}</style></head>
          <body><h1>World Clocks $VERSION</h1>
          <p><a href="world-clocks-latest.xpi">Install in Firefox</a> (open this page in Firefox and click the link).</p>
          <p>Once installed, Firefox updates it automatically from <code>updates.json</code>.</p>
          <h2>What's new in $VERSION</h2><ul>$NOTES_HTML</ul></body></html>
          HTML
          cat site/updates.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Attach the signed .xpi to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: site/world-clocks-${{ env.VERSION }}.xpi

  # Separate job so a failed Pages deploy can be retried with "Re-run failed jobs"
  # without signing again (Mozilla refuses to sign the same version twice).
  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
